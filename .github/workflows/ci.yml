name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test deps
        # The unit tests only touch config/dataset/io/visualize, so we avoid
        # pulling torch/ultralytics and install the package without its deps.
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pyyaml numpy opencv-python-headless
          pip install --no-deps -e .

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest -q
